services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vitachain-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
      - ./logs/nginx/security.log:/var/log/nginx/security.log
      - ./logs/nginx/bots.log:/var/log/nginx/bots.log
      - ./logs/nginx/rate_limit.log:/var/log/nginx/rate_limit.log
    networks:
      - vitachain_network
    depends_on:
      - frontend
      - backend-katara
      - backend-farmarket
      - backend-secondserve
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: vitachain-frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-https://vitachain.ma}
    networks:
      - vitachain_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  backend-katara:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: vitachain-backend-katara
    command: ["uvicorn", "app.api.routes.katara:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    environment:
      - MODULE=katara
      - DATABASE_URL=${SUPABASE_DB_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379
      - ENABLE_METRICS=true
      - METRICS_INTERVAL=60
      - API_RESPONSE_TIME_THRESHOLD=500
      - MEMORY_USAGE_THRESHOLD=80
      - CPU_USAGE_THRESHOLD=80
      - DISK_USAGE_THRESHOLD=85
      # Security Configuration
      - IOT_API_KEY=${IOT_API_KEY}
      - API_KEY_ROTATION_ENABLED=true
      - API_KEY_ROTATION_DAYS=90
      - SECURITY_LOG_LEVEL=INFO
      - SECURITY_ALERT_EMAIL=${SECURITY_ALERT_EMAIL:-admin@vitachain.ma}
      - FAILED_AUTH_THRESHOLD=5
      - RATE_LIMIT_ALERT_THRESHOLD=100
      - FIREWALL_ENABLED=true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/log
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - vitachain_network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  backend-farmarket:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: vitachain-backend-farmarket
    command: ["uvicorn", "app.api.routes.farmarket:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    environment:
      - MODULE=farmarket
      - DATABASE_URL=${SUPABASE_DB_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379
      - ENABLE_METRICS=true
      - METRICS_INTERVAL=60
      - API_RESPONSE_TIME_THRESHOLD=500
      - MEMORY_USAGE_THRESHOLD=80
      - CPU_USAGE_THRESHOLD=80
      - DISK_USAGE_THRESHOLD=85
    networks:
      - vitachain_network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  backend-secondserve:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: vitachain-backend-secondserve
    command: ["uvicorn", "app.api.routes.secondserve:app", "--host", "0.0.0.0", "--port", "8002"]
    expose:
      - "8002"
    environment:
      - MODULE=secondserve
      - DATABASE_URL=${SUPABASE_DB_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379
      - ENABLE_METRICS=true
      - METRICS_INTERVAL=60
      - API_RESPONSE_TIME_THRESHOLD=500
      - MEMORY_USAGE_THRESHOLD=80
      - CPU_USAGE_THRESHOLD=80
      - DISK_USAGE_THRESHOLD=85
    networks:
      - vitachain_network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

redis:
    image: redis:7-alpine
    container_name: vitachain-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - vitachain_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  vitachain_network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
