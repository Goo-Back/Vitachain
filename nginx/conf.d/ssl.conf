# SSL Configuration for VitaChain
# TLS 1.3 only with strong ciphers and security hardening

# SSL/TLS Configuration
ssl_protocols TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
ssl_conf_command Options PrioritizeChaCha;

# SSL Session Configuration
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;
ssl_stapling_file /etc/letsencrypt/live/vitachain.ma/ocsp.resp;

# SSL Certificate Configuration
ssl_certificate /etc/letsencrypt/live/vitachain.ma/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/vitachain.ma/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/vitachain.ma/chain.pem;

# SSL Security Headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Server Configuration
server_tokens off;
more_clear_headers Server;
more_clear_headers X-Powered-By;

# HTTP to HTTPS Redirect Server
server {
    listen 80;
    server_name vitachain.ma api.vitachain.ma www.vitachain.ma;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
    
    # Security headers for redirect
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    server_name vitachain.ma www.vitachain.ma;
    
    # SSL Configuration
    include conf.d/ssl.conf;
    
    # Root and index files
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Security Headers
    include conf.d/security.conf;
    
    # Rate Limiting
    include conf.d/rate-limiting.conf;
    
    # Main application proxy
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS API Server
server {
    listen 443 ssl http2;
    server_name api.vitachain.ma;
    
    # SSL Configuration
    include conf.d/ssl.conf;
    
    # Security Headers
    include conf.d/security.conf;
    
    # Rate Limiting
    include conf.d/rate-limiting.conf;
    
    # API Routes
    location /api/ {
        # Apply API rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://backend-katara:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # API specific timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Telemetry endpoint (higher rate limit)
    location /api/telemetry {
        limit_req zone=telemetry_limit burst=200 nodelay;
        
        proxy_pass http://backend-katara:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Telemetry specific timeouts (fast processing)
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
    
    # Authentication endpoints (stricter rate limit)
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        
        proxy_pass https://supabase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
