# Rate Limiting Configuration for VitaChain
# Implements tiered rate limiting for different endpoint types

# Rate limiting zones - defined in http context
limit_req_zone $binary_remote_addr zone=general_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=telemetry_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload_api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=static_content:10m rate=50r/s;

# Rate limiting status and logging configuration
limit_req_status 429;
limit_req_log_level warn;

# Custom error page for rate limiting
error_page 429 @rate_limit_exceeded;

location @rate_limit_exceeded {
    add_header Content-Type "application/json" always;
    add_header Retry-After "60" always;
    return 429 '{"error": {"code": "RATE_LIMIT_EXCEEDED", "message": "Too many requests. Please try again later.", "retry_after": 60}}';
}

# Apply rate limiting to different endpoint types

# General API endpoints (10 req/sec)
location /api/ {
    limit_req zone=general_api burst=20 nodelay;
    
    # Log rate limit violations
    limit_req_log_level warn;
    
    # Add rate limiting headers
    add_header X-RateLimit-Limit "10" always;
    add_header X-RateLimit-Remaining "9" always;
    add_header X-RateLimit-Reset "60" always;
}

# Telemetry ingestion (100 req/sec) - high frequency IoT data
location /api/telemetry {
    limit_req zone=telemetry_api burst=200 nodelay;
    
    # Log rate limit violations
    limit_req_log_level warn;
    
    # Add rate limiting headers
    add_header X-RateLimit-Limit "100" always;
    add_header X-RateLimit-Remaining "99" always;
    add_header X-RateLimit-Reset "60" always;
}

# Authentication endpoints (5 req/sec) - strict rate limiting
location /auth/ {
    limit_req zone=auth_api burst=10 nodelay;
    
    # Log rate limit violations
    limit_req_log_level warn;
    
    # Add rate limiting headers
    add_header X-RateLimit-Limit "5" always;
    add_header X-RateLimit-Remaining "4" always;
    add_header X-RateLimit-Reset "60" always;
    
    # Additional security for auth endpoints
    limit_req zone=auth_api burst=5 nodelay;
}

# File upload endpoints (2 req/sec) - very restrictive
location ~ ^/api/(.*upload|.*file)/ {
    limit_req zone=upload_api burst=5 nodelay;
    
    # Log rate limit violations
    limit_req_log_level warn;
    
    # Add rate limiting headers
    add_header X-RateLimit-Limit "2" always;
    add_header X-RateLimit-Remaining "1" always;
    add_header X-RateLimit-Reset "60" always;
}

# Static content (50 req/sec) - higher limit for assets
location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
    limit_req zone=static_content burst=100 nodelay;
    
    # Cache static content
    expires 1y;
    add_header Cache-Control "public, immutable";
    
    # Add rate limiting headers
    add_header X-RateLimit-Limit "50" always;
    add_header X-RateLimit-Remaining "49" always;
    add_header X-RateLimit-Reset "60" always;
}

# Global rate limiting for all requests (fallback)
location / {
    # Apply general rate limiting as fallback
    limit_req zone=general_api burst=30 nodelay;
    
    # Log all requests for monitoring
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

# Special handling for health checks (no rate limiting)
location /health {
    # No rate limiting for health checks
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}

# Rate limiting for specific attack patterns

# Block suspicious user agents with rate limiting
if ($http_user_agent ~* "(bot|crawler|spider|scraper)") {
    limit_req zone=general_api burst=5 nodelay;
}

# Block requests with suspicious parameters
if ($args ~* "(union|select|insert|update|delete|drop|exec|script|alert)") {
    limit_req zone=general_api burst=1 nodelay;
}

# IP-based rate limiting for known problematic IPs
# This would be populated by a security monitoring system
geo $limit_by_ip {
    default 1;
    # Add specific IPs to limit here if needed
    # 192.168.1.100 0;  # Block this IP
}

# Apply IP-based limiting
if ($limit_by_ip = 0) {
    return 403;
}

# Connection limiting (prevent connection floods)
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_conn conn_limit_per_ip 20;

# Apply connection limiting
location / {
    limit_conn conn_limit_per_ip 20;
}

# Bandwidth limiting for large responses
limit_rate_after 1m;
limit_rate 512k;

# Apply bandwidth limiting to file downloads
location ~* \.(zip|tar|gz|pdf|mp4|avi)$ {
    limit_rate_after 1m;
    limit_rate 256k;
}

# Request rate limiting per server
limit_req_status 429;
limit_req_log_level warn;

# Custom error handling for different rate limit scenarios
error_page 429 = @rate_limit_exceeded;
error_page 503 = @service_unavailable;

location @service_unavailable {
    add_header Content-Type "application/json" always;
    return 503 '{"error": {"code": "SERVICE_UNAVAILABLE", "message": "Service temporarily unavailable. Please try again later."}}';
}

# Rate limiting monitoring and logging

# Log format for rate limiting
log_format rate_limit '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'limit="$limit_req_status"';

# Access log for rate limiting
access_log /var/log/nginx/rate_limit.log rate_limit;

# Additional security headers for rate limited responses
add_header X-RateLimit-Domain "vitachain.ma" always;
add_header X-RateLimit-Service "api" always;
