# Upstream backend servers with performance optimizations
upstream katara_api {
    server backend-katara:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream farmarket_api {
    server backend-farmarket:8001 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream secondserve_api {
    server backend-secondserve:8002 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# API subdomain
server {
    listen 80;
    server_name api.vitachain.ma;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# API HTTPS server
server {
    listen 443 ssl http2;
    server_name api.vitachain.ma;
    
    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/vitachain.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitachain.ma/privkey.pem;
    
    # Include security configuration
    include /etc/nginx/conf.d/security.conf;
    
    # API routing with rate limiting and performance optimizations
    location /api/telemetry {
        limit_req zone=telemetry burst=400 nodelay;
        limit_conn conn_limit_per_ip 20;
        
        # Performance optimizations
        proxy_pass http://katara_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts and buffering
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Caching for telemetry data (short cache)
        add_header X-Cache-Status "DYNAMIC" always;
        add_header X-Response-Time "$request_time" always;
    }
    
    location /api/katara/ {
        limit_req zone=api burst=100 nodelay;
        limit_conn conn_limit_per_ip 10;
        
        # Performance optimizations
        proxy_pass http://katara_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts and buffering
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Cache headers for GET requests
        if ($request_method = GET) {
            add_header Cache-Control "public, max-age=300" always;
        }
        
        add_header X-Cache-Status "DYNAMIC" always;
        add_header X-Response-Time "$request_time" always;
    }
    
    location /api/farmarket/ {
        limit_req zone=api burst=100 nodelay;
        limit_conn conn_limit_per_ip 10;
        
        # Performance optimizations
        proxy_pass http://farmarket_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts and buffering
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Cache headers for public listings
        location ~* ^/api/farmarket/listings$ {
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=60" always;
        }
        
        add_header X-Cache-Status "DYNAMIC" always;
        add_header X-Response-Time "$request_time" always;
    }
    
    location /api/secondserve/ {
        limit_req zone=api burst=100 nodelay;
        limit_conn conn_limit_per_ip 10;
        
        # Performance optimizations
        proxy_pass http://secondserve_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts and buffering
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Cache headers for public meals
        location ~* ^/api/secondserve/meals$ {
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=60" always;
        }
        
        add_header X-Cache-Status "DYNAMIC" always;
        add_header X-Response-Time "$request_time" always;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "api-healthy\n";
        add_header Content-Type text/plain;
    }
}
