# Comprehensive Security Headers Configuration for VitaChain
# This file provides enterprise-grade security headers and protections

# Content Security Policy (CSP) - Prevent XSS and code injection
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://supabase.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https: https://images.unsplash.com; connect-src 'self' https://api.supabase.co https://api.anthropic.com https://api.brevo.com https://openweathermap.org; font-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Additional Security Headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), autoplay=(), encrypted-media=(), fullscreen=(), picture-in-picture=()" always;

# Additional Security Headers
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Download-Options "noopen" always;
add_header X-Android-App-Source "none" always;

# Hide server information
server_tokens off;
more_clear_headers Server;
more_clear_headers X-Powered-By;
more_clear_headers X-AspNet-Version;
more_clear_headers X-AspNetMvc-Version;

# CORS Configuration for API endpoints
# This will be included in specific server blocks as needed
set $cors "";
if ($http_origin ~* "^https://(vitachain\.ma|www\.vitachain\.ma)$") {
    set $cors "true";
}

if ($cors = "true") {
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;
}

# Handle preflight OPTIONS requests
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;
    add_header Content-Length "0";
    add_header Content-Type "text/plain";
    return 204;
}

# Security logging for suspicious requests
# Log requests with suspicious patterns
if ($args ~* "<[^>]*>|javascript:|vbscript:|onload=|onerror=") {
    access_log /var/log/nginx/security.log;
}

# Log requests with unusual user agents
if ($http_user_agent ~* "(bot|crawler|spider|scraper)") {
    access_log /var/log/nginx/bots.log;
}

# Block common attack patterns
if ($args ~* "(\.\./|\.\.\.|union|select|insert|update|delete|drop|exec|script|alert)") {
    return 403;
}

# Block requests with suspicious characters in URI
if ($uri ~* "(\.\.|%2e%2e|%00)") {
    return 403;
}
